name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Create runtime config from GitHub Secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path('site')
          template = (root / 'config.template.js').read_text(encoding='utf-8')
          key = os.environ.get('GEMINI_API_KEY', '').strip()
          if not key:
              print('Repository Secret GEMINI_API_KEY is not set.', file=sys.stderr)
              sys.exit(1)
          output = template.replace('__GEMINI_API_KEY_JSON__', json.dumps(key))
          (root / 'config.js').write_text(output, encoding='utf-8')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
